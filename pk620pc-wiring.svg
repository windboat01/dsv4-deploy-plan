<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#dc2626"/></marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#059669"/></marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#6b7280"/></marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="900" fill="#f8fafc" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">追风者 PK620PC — 机箱布线示意图</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="#64748b">风道：下进上出 · 电源独立下仓 · 所有线束走背线</text>

  <!-- ============ CASE OUTLINE ============ -->
  <!-- Outer case -->
  <rect x="50" y="75" width="700" height="780" rx="10" fill="none" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Bottom chamber divider (PSU chamber) -->
  <line x1="50" y1="710" x2="750" y2="710" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Motherboard tray area -->
  <rect x="100" y="105" width="440" height="570" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>

  <!-- ============ MOTHERBOARD (H11DSi) ============ -->
  <rect x="120" y="130" width="400" height="500" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" opacity="0.7"/>
  <text x="320" y="150" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="bold">H11DSi E-ATX 主板</text>

  <!-- RAM slots (16 DIMMs - 8 left, 8 right) -->
  <rect x="130" y="170" width="25" height="40" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <rect x="130" y="215" width="25" height="40" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <rect x="130" y="260" width="25" height="40" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <rect x="130" y="305" width="25" height="40" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <rect x="130" y="350" width="25" height="40" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <rect x="130" y="395" width="25" height="40" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <rect x="130" y="440" width="25" height="40" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <rect x="130" y="485" width="25" height="40" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <text x="142" y="665" text-anchor="middle" font-size="10" fill="#d97706">16× DIMM</text>
  <text x="142" y="680" text-anchor="middle" font-size="10" fill="#d97706">DDR4 2400</text>

  <!-- CPU sockets -->
  <rect x="170" y="175" width="90" height="90" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/>
  <text x="215" y="225" text-anchor="middle" font-size="11" fill="#059669" font-weight="bold">CPU0</text>
  <text x="215" y="240" text-anchor="middle" font-size="9" fill="#059669">7302</text>

  <rect x="170" y="320" width="90" height="90" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/>
  <text x="215" y="370" text-anchor="middle" font-size="11" fill="#059669" font-weight="bold">CPU1</text>
  <text x="215" y="385" text-anchor="middle" font-size="9" fill="#059669">7302</text>

  <!-- CPU 8-pin EPS connectors (top of board) -->
  <rect x="230" y="118" width="40" height="14" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="275" y="118" width="40" height="14" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="272" y="112" text-anchor="middle" font-size="9" fill="#dc2626">CPU 8-pin ×2</text>

  <!-- 4U Heatsinks on CPUs -->
  <rect x="260" y="170" width="120" height="100" rx="6" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="320" y="225" text-anchor="middle" font-size="10" fill="#4b5563">4U 5管散热器</text>
  <!-- NF-F12 fan (zip-tied) -->
  <rect x="385" y="175" width="60" height="90" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <text x="415" y="215" text-anchor="middle" font-size="8" fill="#475569">NF-F12</text>
  <text x="415" y="228" text-anchor="middle" font-size="7" fill="#475569">扎带固定</text>
  <!-- Arrow: airflow through heatsink -->
  <line x1="450" y1="220" x2="470" y2="220" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect x="260" y="315" width="120" height="100" rx="6" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="320" y="370" text-anchor="middle" font-size="10" fill="#4b5563">4U 5管散热器</text>
  <rect x="385" y="320" width="60" height="90" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <text x="415" y="360" text-anchor="middle" font-size="8" fill="#475569">NF-F12</text>
  <text x="415" y="373" text-anchor="middle" font-size="7" fill="#475569">扎带固定</text>
  <line x1="450" y1="365" x2="470" y2="365" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- ============ RTX 3090 ============ -->
  <rect x="180" y="540" width="200" height="80" rx="6" fill="#fae8ff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="280" y="575" text-anchor="middle" font-size="12" fill="#a21caf" font-weight="bold">RTX 3090 24GB</text>
  <text x="280" y="592" text-anchor="middle" font-size="9" fill="#86198f">PCIe x16_1（靠近 CPU1）</text>
  <!-- GPU power connector -->
  <rect x="390" y="560" width="50" height="16" rx="3" fill="#fce7f3" stroke="#be185d" stroke-width="1"/>
  <text x="415" y="558" text-anchor="middle" font-size="8" fill="#be185d">供电口</text>

  <!-- ============ BOTTOM INTAKE FANS ============ -->
  <rect x="120" y="720" width="120" height="25" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="180" y="736" text-anchor="middle" font-size="10" fill="#1d4ed8">进风 P14 ×1</text>

  <rect x="260" y="720" width="120" height="25" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="320" y="736" text-anchor="middle" font-size="10" fill="#1d4ed8">进风 P14 ×2</text>

  <!-- Airflow arrows: bottom → up -->
  <line x1="180" y1="718" x2="180" y2="688" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="320" y1="718" x2="320" y2="688" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- ============ TOP EXHAUST FANS ============ -->
  <rect x="120" y="80" width="120" height="25" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="180" y="96" text-anchor="middle" font-size="10" fill="#b45309">出风 P14 ×1</text>

  <rect x="260" y="80" width="120" height="25" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="320" y="96" text-anchor="middle" font-size="10" fill="#b45309">出风 P14 ×2</text>

  <!-- Airflow arrows: inside → top out -->
  <line x1="180" y1="102" x2="180" y2="80" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <line x1="320" y1="102" x2="320" y2="80" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- ============ POWER SUPPLY ============ -->
  <rect x="480" y="730" width="150" height="70" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="555" y="762" text-anchor="middle" font-size="12" fill="#334155" font-weight="bold">长城 G11</text>
  <text x="555" y="778" text-anchor="middle" font-size="9" fill="#64748b">1100W ATX3.0</text>
  <!-- PSU fan -->
  <rect x="485" y="735" width="40" height="60" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="505" y="770" text-anchor="middle" font-size="12" fill="#94a3b8">⏺</text>

  <!-- ============ CABLE ROUTING ============ -->

  <!-- 24-pin motherboard cable -->
  <path d="M530,770 L530,680 Q530,650 500,650 L480,650 Q460,650 460,630 L460,610 L460,590 L460,570 Q460,560 460,555 L460,545 L460,535" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>
  <rect x="440" y="525" width="80" height="18" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="480" y="538" text-anchor="middle" font-size="9" fill="#dc2626">24-pin</text>

  <!-- CPU 8-pin cable 1 -->
  <path d="M500,770 L500,730 Q500,700 530,700 Q560,700 560,670 L560,640 Q560,620 540,620 L500,620 Q470,620 450,600 L400,580 Q380,570 370,560 L350,550 Q330,540 310,530 L290,520 Q270,510 265,500 L265,480 Q265,460 260,440 L260,420 Q260,400 258,380" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="470" y="620" font-size="9" fill="#2563eb">CPU 8-pin ×2</text>

  <!-- GPU power cable -->
  <path d="M520,770 L520,680 Q520,650 550,650 Q580,650 580,620 L580,590 Q580,570 550,570 L500,570 Q470,570 440,570" fill="none" stroke="#a21caf" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <text x="580" y="655" font-size="9" fill="#a21caf">PCIe / 12VHPWR</text>

  <!-- Bottom fan cable routing -->
  <path d="M360,720 L400,720 Q430,720 450,700 Q470,680 470,660 L470,640 Q470,620 440,610" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="480" y="695" font-size="8" fill="#059669">风扇线→CHA_FAN</text>

  <!-- ============ LEGEND ============ -->
  <rect x="580" y="80" width="160" height="280" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="660" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">图例</text>

  <rect x="595" y="115" width="30" height="14" rx="3" fill="#dcfce7" stroke="#059669" stroke-width="1"/>
  <text x="635" y="126" font-size="11" fill="#334155">CPU（EPYC 7302）</text>

  <rect x="595" y="140" width="30" height="14" rx="3" fill="#fae8ff" stroke="#a21caf" stroke-width="1"/>
  <text x="635" y="151" font-size="11" fill="#334155">GPU（RTX 3090）</text>

  <rect x="595" y="165" width="30" height="14" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="635" y="176" font-size="11" fill="#334155">DDR4 内存（16×）</text>

  <rect x="595" y="190" width="30" height="14" rx="3" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <text x="635" y="201" font-size="11" fill="#334155">4U 服务器散热器</text>

  <rect x="595" y="215" width="30" height="14" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
  <text x="635" y="226" font-size="11" fill="#334155">NF-F12（扎带固定）</text>

  <rect x="595" y="240" width="30" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="635" y="251" font-size="11" fill="#334155">进出风风扇 P14</text>

  <rect x="595" y="265" width="30" height="14" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
  <text x="635" y="276" font-size="11" fill="#334155">长城 G11 电源</text>

  <line x1="595" y1="296" x2="625" y2="296" stroke="#dc2626" stroke-width="3"/>
  <text x="635" y="300" font-size="11" fill="#334155">24-pin 线缆</text>

  <line x1="595" y1="316" x2="625" y2="316" stroke="#2563eb" stroke-width="2.5"/>
  <text x="635" y="320" font-size="11" fill="#334155">CPU 8-pin 线缆</text>

  <line x1="595" y1="336" x2="625" y2="336" stroke="#a21caf" stroke-width="2.5"/>
  <text x="635" y="340" font-size="11" fill="#334155">GPU 供电线</text>

  <line x1="595" y1="356" x2="625" y2="356" stroke="#059669" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="635" y="360" font-size="11" fill="#334155">PWM 风扇信号线</text>

  <!-- Airflow arrows in legend -->
  <line x1="595" y1="376" x2="615" y2="376" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="635" y="380" font-size="11" fill="#334155">冷风进风 ↑</text>

  <line x1="595" y1="396" x2="615" y2="396" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="635" y="400" font-size="11" fill="#334155">热风出风 ↑</text>

  <!-- ============ NOTES ============ -->
  <rect x="70" y="815" width="660" height="30" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="1"/>
  <text x="80" y="835" font-size="11" fill="#92400e">💡 注意事项：所有线束走机箱背面理线空间（PK620PC 背线空间 ~25mm）；底部风扇线沿机箱底部边缘走到 CHA_FAN；CPU 线从左上角理线孔穿出插到 EPS12V 接口</text>

</svg>
